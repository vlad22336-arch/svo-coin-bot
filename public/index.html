<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Tycoon</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Баланс -->
    <header class="topbar">
      <div class="stat-card balance-card">
        <div class="stat-label">💰 Баланс</div>
        <div class="stat-value" id="balance">0 SC</div>
      </div>
      <div class="stat-card income-card">
        <div class="stat-label">📈 Доход</div>
        <div class="stat-value" id="income">0 SC/сек</div>
        <div class="stat-sub" id="incomeHour">0 SC/час</div>
      </div>
    </header>

    <!-- Ежедневка -->
    <section class="daily-block" id="dailyBlock" style="display:none;">
      <div class="daily-info">
        <div class="daily-icon">🎁</div>
        <div class="daily-text">
          <div class="daily-title">Ежедневный бонус</div>
          <div class="daily-sub" id="dailySub">День 1 / 7</div>
        </div>
      </div>
      <button class="btn btn-daily" id="dailyBtn">Забрать</button>
    </section>

    <!-- Список бизнесов -->
    <main class="business-list" id="businessList"></main>

    <!-- Достижения -->
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">🏆 Достижения</h2>
        <span class="section-count" id="achCount">0 / 8</span>
      </div>
      <div class="achievements-grid" id="achievementsGrid"></div>
    </section>
  </div>

  <div class="toast" id="toast"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Загрузка...</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
