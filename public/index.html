<div class="form-field">
  <label>ИМЯ</label>
  <input type="text" id="editName" placeholder="Влад" maxlength="30">
</div>

<div class="form-field">
  <label>ВОЗРАСТ</label>
  <input type="number" id="editAge" placeholder="31" min="1" max="99">
</div>

<div class="form-field">
  <label>ГОРОД</label>
  <input type="text" id="editCity" placeholder="Москва" maxlength="40">
</div>

<div class="form-field">
  <label>О СЕБЕ</label>
  <textarea id="editBio" rows="4" placeholder="Расскажи немного о себе..." maxlength="300"></textarea>
</div>
